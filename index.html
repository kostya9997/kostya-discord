<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>P2P Видеозвонок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📹 P2P Видеозвонок</h1>

        <div id="status" class="status waiting">⏳ Ожидание действий...</div>

        <div class="video-container">
            <div class="video-wrapper remote-wrapper">
                <video id="remote-video" autoplay playsinline></video>
                <div class="video-label">👥 Собеседник</div>
            </div>
            <div class="video-wrapper local-wrapper">
                <video id="local-video" autoplay playsinline muted></video>
                <div class="video-label">👤 Вы</div>
            </div>
        </div>

        <div class="controls">
            <button id="mic-btn" class="control-btn off" title="Микрофон">
                <svg id="mic-icon-on" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z" /></svg>
                <svg id="mic-icon-off" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.98zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-3.02 0-5.42-2.38-5.91-5.38-.08-.6-.56-1.14-1-1.14-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c.98-.18 1.9-.54 2.73-1.05l4.01 4L21 19.73 4.27 3z" /></svg>
            </button>
            <button id="cam-btn" class="control-btn off" title="Камера">
                <svg id="cam-icon-on" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z" /></svg>
                <svg id="cam-icon-off" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z" /></svg>
            </button>
        </div>

        <div id="reconnect-section" class="reconnect-section" style="display: none;">
            <p>⚠️ Связь потеряна (сменилась сеть или пропал интернет).</p>
            <button id="reconnect-btn" class="btn btn-warning">🔄 Пересоздать соединение</button>
        </div>

        <div class="sdp-section">
            <h3>📤 Шаг 1: Создайте сигнал</h3>
            <div class="btn-row">
                <button id="create-offer" class="btn btn-primary">📞 Я звоню</button>
                <button id="create-answer" class="btn btn-primary">📱 Я принимаю</button>
            </div>
            <textarea id="local-sdp-output" placeholder="Здесь появится сжатый SDP..." readonly></textarea>
            <div class="btn-row">
                <button id="compress-copy-btn" class="btn btn-success" disabled>⏳ Сбор ICE...</button>
                <span id="copy-status" class="copy-status"></span>
            </div>
        </div>

        <div class="sdp-section">
            <h3>📥 Шаг 2: Вставьте сигнал от друга</h3>
            <textarea id="remote-sdp" placeholder="Вставьте SDP друга сюда (обычный или сжатый)"></textarea>
            <button id="connect-btn" class="btn btn-success">🔗 Подключить</button>
        </div>

        <details class="log-details">
            <summary>🖥️ Системный лог (нажмите, чтобы раскрыть)</summary>
            <div id="onscreen-log"></div>
        </details>
    </div>

    <script src="script.js"></script>
</body>
</html>
