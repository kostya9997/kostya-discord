<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Приватный Голосовой Чат</title>
    <!-- Используем обновленный официальный CDN jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #202225; color: #fff; padding: 40px; text-align: center; margin: 0; }
        .box { background: #2f3136; padding: 25px; border-radius: 8px; display: inline-block; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-bottom: 30px; }
        select, button { padding: 12px; border-radius: 4px; border: none; margin: 10px 0; font-size: 16px; width: 100%; box-sizing: border-box; }
        select { background: #40444b; color: white; cursor: pointer; }
        button { background: #5865f2; color: white; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4752c4; }
        button:disabled { background: #4f545c; cursor: not-allowed; }
        #status { color: #b9bbbe; font-weight: bold; margin-top: 5px; font-size: 14px; }
        #error-log { color: #f04747; font-size: 13px; margin-top: 10px; font-weight: bold; }
        
        .voice-channel { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .user-card { background: #2f3136; padding: 20px; border-radius: 8px; width: 120px; text-align: center; border: 2px solid #4f545c; transition: all 0.3s ease; }
        .user-card.active { border-color: #3ba55d; background: #232428; box-shadow: 0 0 10px rgba(59, 165, 93, 0.4); }
        .avatar { width: 60px; height: 60px; background: #5865f2; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
        .user-name { font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🎙️ Комната голосовой связи</h1>
    
    <div class="box">
        <label for="user-select">Кто вы?</label>
        <select id="user-select">
            <option value="vladick">ВлаDICK</option>
            <option value="alla">Аллах</option>
            <option value="evgeniy">Евгейний</option>
            <option value="kostya">Костыль</option>
            <option value="mariam">Маруам</option>
            <option value="andrysha">Андроид</option>
        </select>
        <button id="start-btn">Зайти в голосовой канал</button>
        <div id="status">Статус: Вне канала</div>
        <div id="error-log"></div>
    </div>

    <h2>👥 Участники в канале:</h2>
    <div class="voice-channel" id="voice-channel"></div>
    <div id="audio-containers"></div>

    <script>
        // UUID v4 генерация
        const TEAM_CONFIG = {
            "vladick": "6f2b1d34-90a1-4e82-b7c3-5c8f1a2b3c4d",
            "alla": "7a3c5e21-1b4d-4f6e-a8b2-3c4d5e6f7a8b",
            "evgeniy": "8b4d6f32-2c5e-4a7f-b9c3-4d5e6f7a8b9c",
            "kostya": "9c5e7a43-3d6f-4b8a-ca04-5d6f7a8b9c0d",
            "mariam": "0d6f8b54-4e7f-4c9b-db15-6d6f7a8b9c0e",
            "andrysha": "1e7f9c65-5f8a-4d0c-ec26-7d6f7a8b9c0f"
        };

        const UUID_TO_KEY = {};
        const KEY_TO_NAME = { "vladick": "ВлаDICK", "alla": "Аллах", "evgeniy": "Евгейний", "kostya": "Колян", "mariam": "Марина", "andrysha": "Андроид" };
        const KEY_TO_EMOJI = { "vladick": "🍆", "alla": "👑", "evgeniy": "🧠", "kostya": "🩼", "mariam": "🍕", "andrysha": "🤖" };
        
        for (let key in TEAM_CONFIG) { UUID_TO_KEY[TEAM_CONFIG[key]] = key; }

        let localStream;
        let peer;

        // Запрашиваем микрофон
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })
            .then(stream => { 
                localStream = stream; 
                document.getElementById('status').innerText = 'Микрофон готов. Выберите имя.';
            })
            .catch(err => { 
                document.getElementById('error-log').innerText = 'Ошибка: Доступ к микрофону заблокирован браузром!';
            });

        document.getElementById('start-btn').addEventListener('click', () => {
            if (!localStream) return alert('Дайте доступ к микрофону!');
            
            const selectedUser = document.getElementById('user-select').value;
            const myUUID = TEAM_CONFIG[selectedUser];

            document.getElementById('start-btn').disabled = true;
            document.getElementById('user-select').disabled = true;
            document.getElementById('status').innerText = 'Связь с сервером сигналов...';
            document.getElementById('error-log').innerText = '';

            renderUserCard(myUUID, true);

            // Создаем подключение
            peer = new Peer(myUUID);

            peer.on('open', (id) => {
                document.getElementById('status').innerText = 'Вы в сети 🟢 Набираем друзей...';
                
                // Звоним остальным
                for (let key in TEAM_CONFIG) {
                    if (key !== selectedUser) {
                        const call = peer.call(TEAM_CONFIG[key], localStream);
                        if(call) handleCall(call);
                    }
                }
            });

            peer.on('call', (incomingCall) => {
                incomingCall.answer(localStream);
                handleCall(incomingCall);
            });

            // Отлавливаем любые сетевые ошибки PeerJS
            peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                document.getElementById('error-log').innerText = `Ошибка сети: ${err.type}`;
                if(err.type === 'unavailable-id') {
                    document.getElementById('error-log').innerText = 'Этот персонаж уже занят в другой вкладке!';
                }
            });
        });

        function handleCall(call) {
            call.on('stream', (remoteStream) => {
                if (document.getElementById(`audio-${call.peer}`)) return;

                const audio = document.createElement('audio');
                audio.id = `audio-${call.peer}`;
                audio.srcObject = remoteStream;
                audio.autoplay = true;
                audio.controls = true; // Добавим панель управления, чтобы обойти блокировку звука
                audio.style.display = 'block';
                audio.style.margin = '10px auto';
                audio.style.height = '30px';
                
                document.getElementById('audio-containers').appendChild(audio);
                renderUserCard(call.peer, false);
            });

            call.on('close', () => { removeUserCard(call.peer); });
        }

        function renderUserCard(uuid, isMe) {
            if (document.getElementById(`card-${uuid}`)) return;
            const internalKey = UUID_TO_KEY[uuid];
            const displayName = KEY_TO_NAME[internalKey] || "Кто-то";
            const emoji = KEY_TO_EMOJI[internalKey] || "👤";

            const card = document.createElement('div');
            card.id = `card-${uuid}`;
            card.className = 'user-card active';
            card.innerHTML = `<div class="avatar">${emoji}</div><div class="user-name">${displayName} ${isMe ? '(Вы)' : ''}</div>`;
            document.getElementById('voice-channel').appendChild(card);
        }

        function removeUserCard(uuid) {
            const card = document.getElementById(`card-${uuid}`); if (card) card.remove();
            const audio = document.getElementById(`audio-${uuid}`); if (audio) audio.remove();
        }
    </script>
</body>
</html>
